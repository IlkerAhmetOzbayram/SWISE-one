# nginx: dışarıdan gelen istekleri uygulamaya (127.0.0.1:3000) iletir.
# ALAN_ADI kurulum betiği tarafından değiştirilir; HTTPS ayarlarını certbot ekler.
server {
    listen 80;
    listen [::]:80;
    server_name ALAN_ADI;

    # Teklif ve fatura ekleri en fazla 20 MB
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Gelen başlığa eklenmez, üzerine yazılır: istemci IP'si taklit edilemez (hatalı giriş sınırı IP'ye bakar)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
